name: 接口自动化回归
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'     # 每晚北京时间22:00定时跑；不想要定时就删掉这两行
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 运行接口测试
        run: pytest --alluredir=allure-results
      - name: 安装 Allure
        run: |
          wget -qO allure.zip https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.zip
          unzip -q allure.zip -d $HOME/allure
      - name: 生成报告
        run: $HOME/allure/allure-2.27.0/bin/allure generate allure-results -o public --clean
      - name: 打包页面
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: api-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
